{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Single stopped Ubuntu ARM64 factory host. JSON-form YAML; no credentials or automatic issue execution.",
  "Parameters": {
    "UbuntuAmi": {
      "Type": "AWS::EC2::Image::Id",
      "Description": "Explicit Canonical Ubuntu 24.04 ARM64 AMI ID resolved and verified by the operator in eu-central-1."
    }
  },
  "Resources": {
    "Vpc": {
      "Type": "AWS::EC2::VPC",
      "Properties": {"CidrBlock": "10.77.0.0/16", "EnableDnsSupport": true, "EnableDnsHostnames": true, "Tags": [{"Key": "Name", "Value": "software-factory"}]}
    },
    "InternetGateway": {"Type": "AWS::EC2::InternetGateway"},
    "GatewayAttachment": {
      "Type": "AWS::EC2::VPCGatewayAttachment",
      "Properties": {"VpcId": {"Ref": "Vpc"}, "InternetGatewayId": {"Ref": "InternetGateway"}}
    },
    "Subnet": {
      "Type": "AWS::EC2::Subnet",
      "Properties": {"VpcId": {"Ref": "Vpc"}, "CidrBlock": "10.77.1.0/24", "AvailabilityZone": {"Fn::Select": [0, {"Fn::GetAZs": ""}]}}
    },
    "RouteTable": {"Type": "AWS::EC2::RouteTable", "Properties": {"VpcId": {"Ref": "Vpc"}}},
    "SubnetRouteTable": {
      "Type": "AWS::EC2::SubnetRouteTableAssociation",
      "Properties": {"SubnetId": {"Ref": "Subnet"}, "RouteTableId": {"Ref": "RouteTable"}}
    },
    "DefaultRoute": {
      "Type": "AWS::EC2::Route",
      "DependsOn": "GatewayAttachment",
      "Properties": {"RouteTableId": {"Ref": "RouteTable"}, "DestinationCidrBlock": "0.0.0.0/0", "GatewayId": {"Ref": "InternetGateway"}}
    },
    "SecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {"GroupDescription": "Outbound only; administer through Session Manager", "VpcId": {"Ref": "Vpc"}, "SecurityGroupIngress": [], "SecurityGroupEgress": [{"IpProtocol": "-1", "CidrIp": "0.0.0.0/0"}]}
    },
    "HostRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Principal": {"Service": "ec2.amazonaws.com"}, "Action": "sts:AssumeRole"}]},
        "ManagedPolicyArns": ["arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"]
      }
    },
    "InstanceProfile": {"Type": "AWS::IAM::InstanceProfile", "Properties": {"Roles": [{"Ref": "HostRole"}]}},
    "DataVolume": {
      "Type": "AWS::EC2::Volume",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {"AvailabilityZone": {"Fn::Select": [0, {"Fn::GetAZs": ""}]}, "Encrypted": true, "Size": 100, "VolumeType": "gp3", "Tags": [{"Key": "Name", "Value": "software-factory-data"}]}
    },
    "Host": {
      "Type": "AWS::EC2::Instance",
      "DependsOn": ["DefaultRoute", "SubnetRouteTable"],
      "Properties": {
        "ImageId": {"Ref": "UbuntuAmi"},
        "InstanceType": "t4g.xlarge",
        "IamInstanceProfile": {"Ref": "InstanceProfile"},
        "MetadataOptions": {"HttpTokens": "required", "HttpPutResponseHopLimit": 1},
        "NetworkInterfaces": [{"DeviceIndex": "0", "AssociatePublicIpAddress": true, "SubnetId": {"Ref": "Subnet"}, "GroupSet": [{"Ref": "SecurityGroup"}]}],
        "BlockDeviceMappings": [{"DeviceName": "/dev/sda1", "Ebs": {"VolumeSize": 30, "VolumeType": "gp3", "Encrypted": true, "DeleteOnTermination": true}}],
        "Tags": [{"Key": "Name", "Value": "software-factory"}],
        "UserData": {"Fn::Base64": {"Fn::Join": ["\n", [
          "#!/bin/bash",
          "# Prepare only the exact attached data volume; preserve existing files and leave runner execution stopped.",
          "set -euo pipefail",
          "systemctl start snap.amazon-ssm-agent.amazon-ssm-agent.service",
          {"Fn::Sub": "volume='${DataVolume}'"},
          "device=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$(printf '%s' \"$volume\" | tr -d '-')",
          "for attempt in $(seq 1 120); do [ ! -b \"$device\" ] || break; sleep 2; done",
          "test -b \"$device\"",
          "test \"$(lsblk -dn -o SERIAL \"$device\" | tr -d ' -')\" = \"$(printf '%s' \"$volume\" | tr -d '-')\"",
          "filesystem=$(lsblk -dn -o FSTYPE \"$device\")",
          "if [ -z \"$filesystem\" ]; then",
          "  test \"$(lsblk -n -o TYPE \"$device\")\" = disk",
          "  test -z \"$(lsblk -nr -o MOUNTPOINT \"$device\")\"",
          "  wipefs --no-act --json \"$device\" | /usr/bin/python3 -c 'import json,sys; assert not json.load(sys.stdin)[\"signatures\"], \"refusing disk with existing signatures\"'",
          "  mkfs.ext4 -L factory-data \"$device\"",
          "elif [ \"$filesystem\" != ext4 ]; then",
          "  echo 'refusing non-ext4 data volume' >&2; exit 1",
          "fi",
          "# Persist one expected mount entry; conflicting existing entries require operator inspection.",
          "persist_mount() {",
          "  local entry=\"$*\" existing",
          "  existing=$(awk -v target=\"$2\" '$2 == target {print}' /etc/fstab)",
          "  if [ -n \"$existing\" ] && [ \"$existing\" != \"$entry\" ]; then echo 'refusing conflicting fstab entry' >&2; exit 1; fi",
          "  if [ -z \"$existing\" ]; then printf '%s\\n' \"$entry\" >> /etc/fstab; fi",
          "}",
          "uuid=$(blkid -s UUID -o value \"$device\")",
          "test -n \"$uuid\"",
          "test ! -L /srv/software-factory",
          "mkdir -p /srv/software-factory",
          "if mountpoint -q /srv/software-factory; then",
          "  test \"$(findmnt -no UUID --mountpoint /srv/software-factory)\" = \"$uuid\"",
          "else",
          "  test -z \"$(find /srv/software-factory -mindepth 1 -maxdepth 1 -print -quit)\"",
          "  mount \"$device\" /srv/software-factory",
          "fi",
          "persist_mount UUID=$uuid /srv/software-factory ext4 defaults,nofail,x-systemd.device-timeout=120s 0 2",
          "for mapping in home:/home/factory docker:/var/lib/docker containerd:/var/lib/containerd; do",
          "  name=$(printf '%s' \"$mapping\" | cut -d: -f1)",
          "  target=$(printf '%s' \"$mapping\" | cut -d: -f2)",
          "  source=/srv/software-factory/$name",
          "  test ! -L \"$source\"; test ! -L \"$target\"",
          "  if [ ! -e \"$source\" ]; then",
          "    if [ \"$name\" = home ]; then install -d -m 0700 -o 2000 -g 2000 \"$source\"; else mkdir \"$source\"; fi",
          "  fi",
          "  if [ \"$name\" = home ]; then test \"$(stat -c '%u:%g' \"$source\")\" = 2000:2000; fi",
          "  mkdir -p \"$target\"",
          "  if mountpoint -q \"$target\"; then test \"$source\" -ef \"$target\"; else",
          "    test -z \"$(find \"$target\" -mindepth 1 -maxdepth 1 -print -quit)\"",
          "    mount --bind \"$source\" \"$target\"",
          "  fi",
          "  persist_mount \"$source\" \"$target\" none bind,nofail,x-systemd.requires-mounts-for=/srv/software-factory 0 0",
          "done",
          "for service in docker containerd; do",
          "  directory=/etc/systemd/system/$service.service.d",
          "  mkdir -p \"$directory\"",
          "  expected=$(printf '[Unit]\\nRequiresMountsFor=/srv/software-factory /var/lib/docker /var/lib/containerd\\n')",
          "  file=$directory/factory-storage.conf",
          "  if [ -e \"$file\" ]; then test ! -L \"$file\"; test \"$(<\"$file\")\" = \"$expected\"; else printf '%s\\n' \"$expected\" > \"$file\"; fi",
          "done",
          "systemctl daemon-reload",
          "touch /var/lib/software-factory-storage-ready",
          ""
        ]]}}
      }
    },
    "DataAttachment": {"Type": "AWS::EC2::VolumeAttachment", "Properties": {"InstanceId": {"Ref": "Host"}, "VolumeId": {"Ref": "DataVolume"}, "Device": "/dev/sdf"}}
  },
  "Outputs": {
    "InstanceId": {"Value": {"Ref": "Host"}},
    "DataVolumeId": {"Value": {"Ref": "DataVolume"}},
    "AvailabilityZone": {"Value": {"Fn::GetAtt": ["Host", "AvailabilityZone"]}},
    "UbuntuAmi": {"Value": {"Ref": "UbuntuAmi"}}
  }
}
